[project]
name = "fnas-lcd"
version = "0.1.0"
description = "Latency-constrained neural architecture search web service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "tqdm>=4.65",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    # Tapis client — used to submit training jobs to SDSC Expanse (see
    # src/web/services/tapis_service.py). Training runs remotely on GPU
    # hardware; the service only submits, polls, and fetches results.
    "tapipy>=1.6",
    # Used directly for the userinfo endpoint (tapis_service). tapipy pulls
    # requests in anyway, but relying on a transitive dependency for a direct
    # import breaks silently if tapipy ever changes its HTTP client.
    "requests>=2.31",
]

# Application, not a library — skip build-backend/packaging entirely.
# Source lives under src/ (see src/__init__.py); entrypoint is
# src.web.main:app, run from the repo root.
[tool.uv]
package = false

# Expanse's GPUs are V100s, which CUDA 13 builds no longer support. On Linux
# x86_64 (the ICICLE image), take torch and torchvision from PyTorch's CUDA
# 12.6 build instead, the one it keeps for older GPUs.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
