services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fnas_lcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fnas_lcd}
      POSTGRES_DB: ${POSTGRES_DB:-fnas_lcd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fnas_lcd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fnas_lcd}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fnas_lcd_secret}
    ports:
      - "9001:9001"  # console UI, useful for local debugging
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fnas_lcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fnas_lcd}
      POSTGRES_DB: ${POSTGRES_DB:-fnas_lcd}
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fnas_lcd}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fnas_lcd_secret}
      S3_BUCKET: ${S3_BUCKET:-fnas-lcd-models}
      # Remote GPU training via Tapis. Defaults to off so the stack comes up
      # without credentials; set TAPIS_ENABLED=1 in .env to submit real jobs.
      TAPIS_ENABLED: ${TAPIS_ENABLED:-0}
      TAPIS_BASE_URL: ${TAPIS_BASE_URL:-https://icicleai.tapis.io}
      TAPIS_USERNAME: ${TAPIS_USERNAME:-}
      TAPIS_PASSWORD: ${TAPIS_PASSWORD:-}
      TAPIS_JWT: ${TAPIS_JWT:-}
      TAPIS_CLIENT_ID: ${TAPIS_CLIENT_ID:-}
      TAPIS_CLIENT_KEY: ${TAPIS_CLIENT_KEY:-}
      TAPIS_REFRESH_TOKEN: ${TAPIS_REFRESH_TOKEN:-}
      TAPIS_APP_ID: ${TAPIS_APP_ID:-fnas-lcd-train}
      TAPIS_APP_VERSION: ${TAPIS_APP_VERSION:-0.1.3}
      TAPIS_SYSTEM: ${TAPIS_SYSTEM:-pitzer-tapis}
      TAPIS_QUEUE: ${TAPIS_QUEUE:-gpu-exp}
      TAPIS_STAGE_MODE: ${TAPIS_STAGE_MODE:-in_place}
      TOY_DATASET_REMOTE_PATH: ${TOY_DATASET_REMOTE_PATH:-}
      TAPIS_WORK_BASE: ${TAPIS_WORK_BASE:-}
      TAPIS_POLL_SECONDS: ${TAPIS_POLL_SECONDS:-30}
      TAPIS_MAX_MINUTES: ${TAPIS_MAX_MINUTES:-1440}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      # Datasets + checkpoints need real POSIX paths for training regardless
      # of storage backend, so they stay on a local volume, not object
      # storage. Models are transient here — exported, uploaded to `storage`,
      # then deleted (see src/web/services/nas_runner.py).
      - app_storage:/app/src/web/storage

volumes:
  postgres_data:
  minio_data:
  app_storage:
